<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc"><title id="title">Developer illustration</title><desc id="desc">Animated abstract illustration of code brackets, a laptop and floating code symbols.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b38"/><stop offset="1" stop-color="#29345f"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4d4d"/><stop offset="1" stop-color="#ff9d66"/></linearGradient></defs><rect x="10" y="10" width="400" height="400" rx="42" fill="url(#bg)"/><circle cx="330" cy="90" r="42" fill="#ff4d4d" opacity=".18"><animate attributeName="r" values="36;46;36" dur="4s" repeatCount="indefinite"/></circle><g font-family="monospace" font-weight="bold" font-size="44" fill="#8ee6d1"><text x="45" y="105">&lt;/&gt;<animate attributeName="y" values="105;95;105" dur="3s" repeatCount="indefinite"/></text><text x="300" y="300" fill="#ff9d66">{ }</text></g><rect x="78" y="145" width="264" height="166" rx="18" fill="#0d1229" stroke="#7786bd" stroke-width="4"/><rect x="94" y="162" width="232" height="126" rx="8" fill="#202b50"/><circle cx="110" cy="178" r="4" fill="#ff6b6b"/><circle cx="124" cy="178" r="4" fill="#ffd166"/><circle cx="138" cy="178" r="4" fill="#8ee6d1"/><g stroke-linecap="round" stroke-width="7"><path d="M116 205h85" stroke="#8ee6d1"/><path d="M132 226h126" stroke="#ff9d66"/><path d="M116 247h70" stroke="#9ba8ff"/><path d="M145 268h105" stroke="#8ee6d1"/></g><path d="M55 323h310l-28 31H83z" fill="#b9c4ec"/><path d="M170 323h80l-10 12h-60z" fill="#7786bd"/><g fill="#ff4d4d"><circle cx="80" cy="120" r="6"><animate attributeName="cy" values="120;110;120" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="346" cy="126" r="5"><animate attributeName="cy" values="126;137;126" dur="3.4s" repeatCount="indefinite"/></circle></g></svg>