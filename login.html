<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FitLife</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Firebase Libraries for Authentication -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <div class="logo-icon">💪</div>
          Fit<span>Life</span>
        </a>
        <p>Welcome back! Login to continue.</p>
      </div>

      <h2>Login</h2>

      <div id="authAlert" class="alert"></div>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <span class="input-icon">📧</span>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle">👁️</button>
        </div>

        <button type="submit" class="btn btn-primary auth-btn" id="authSubmitBtn">Login</button>
      </form>

      <div class="auth-loading" id="authLoading">
        <div class="spinner"></div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
